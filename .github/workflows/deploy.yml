name: Deploy Angular to GitHub Pages

on:
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Angular 17 officially supports Node 18/20; Node 24 reports as
          # "Unsupported" and the prerender step is the fragile part of the build.
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Since you are using a custom domain (raosengineering.com), base href must be /
        # Prerendering writes a real <route>/index.html for every route, so GitHub
        # Pages serves each one with HTTP 200 instead of falling back to 404.html.
        run: npm run build -- --base-href /

      - name: Verify prerendered routes exist
        # Fails the deploy if prerendering silently produced fewer pages than expected.
        run: |
          count=$(find dist/raoengineering-v2/browser -name index.html | wc -l)
          echo "Prerendered pages: $count"
          test "$count" -eq 11
          test -f dist/raoengineering-v2/browser/robots.txt
          test -f dist/raoengineering-v2/browser/sitemap.xml

      - name: Copy index.html to 404.html (fallback for unknown URLs only)
        run: cp dist/raoengineering-v2/browser/index.html dist/raoengineering-v2/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the specific browser output directory created by Angular 17+
          path: './dist/raoengineering-v2/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
